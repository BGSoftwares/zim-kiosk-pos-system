name: Generate Django migrations

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/apps/**/models.py'
      - 'backend/config/settings.py'

permissions:
  contents: write

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements/base.txt
      - name: Generate migrations
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-migration-secret
          DJANGO_DEBUG: 'True'
          MYSQL_DATABASE: zim_kiosk
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
        run: python manage.py makemigrations
      - name: Commit generated migrations
        run: |
          if git diff --quiet -- backend/apps; then
            echo 'No migration changes generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/apps/*/migrations
          git commit -m 'db: generate Django migrations'
          git push origin HEAD:${{ github.ref_name }}
