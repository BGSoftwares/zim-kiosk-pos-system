name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile when absent
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile
        run: test -f package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: zim_kiosk
          MYSQL_USER: zim_kiosk
          MYSQL_PASSWORD: zim_kiosk
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements/base.txt
      - name: Django checks and tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: 'True'
          MYSQL_DATABASE: zim_kiosk
          MYSQL_USER: zim_kiosk
          MYSQL_PASSWORD: zim_kiosk
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run --dry-run
          python manage.py migrate --noinput
          python manage.py test
